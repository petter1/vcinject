[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vcinject"
version = "0.1.0"
description = "3DS Virtual Console injector (NSUI alternative) for macOS and Linux"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["Pillow>=9.0", "segno>=1.5"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest"]

[project.scripts]
vcinject = "vcinject.cli:main"

[project.gui-scripts]
vcinject-gui = "vcinject.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
