[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vcinject"
version = "0.1.0"
description = "3DS Virtual Console injector for macOS, Windows and Linux – installs over Wi-Fi and manages your 3DS with vcinject Link"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yanik Fuchs" }]
keywords = ["3ds", "virtual console", "inject", "gba", "nsui", "cia"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Games/Entertainment",
]
requires-python = ">=3.9"
dependencies = ["Pillow>=9.0", "segno>=1.5"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest"]

[project.scripts]
vcinject = "vcinject.cli:main"

[project.gui-scripts]
vcinject-gui = "vcinject.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vcinject = ["data/*.cia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
